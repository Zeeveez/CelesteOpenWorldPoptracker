name: Logic Addition Request
description: Request an addition to logic
title: "[Logic Addition]: "
labels: ["feature-request", "logic"]
assignees:
  - zeeveez
body:
  - type: dropdown
    id: chapter
    attributes:
      label: Chapter
      description: What chapter is the addition for?
      options:
        - 1 - Forsaken City
        - 2 - Old Site
        - 3 - Celestial Resort
        - 4 - Golden Ridge
        - 5 - Mirror Temple
        - 6 - Reflection
        - 7 - The Summit
        - 8 - Core
        - 9 - Farewell
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Side
      description: What side is the addition for (for Farewell use side A)?
      options:
        - A
        - B
        - C
    validations:
      required: true
  - type: input
    id: start-room
    attributes:
      label: Starting Room
      description: What room is the starting room (for multi-room strats, use the room first room in the sequence)?
      placeholder: e.g. b-01
    validations:
      required: true
  - type: dropdown
    id: destination-type
    attributes:
      label: Destination type
      description: What is the type of destination?
      options:
        - Room
        - Strawberry
        - Cassette
        - Crystal Heart
        - Level Clear
        - Car
        - Key
        - Gem
    validations:
      required: true
  - type: input
    id: destination
    attributes:
      label: Ending Room/Location
      description: What room or (if for example there are multiple berries) location is the destination?
      placeholder: e.g. b-02, Strawberry 2
    validations:
      required: false
  - type: textarea
    id: required-items
    attributes:
      label: What items are required?
      description: List every item required for the additional logic, if no items are required, state so.
      placeholder: e.g. kevin blocks, dash refills, coins
    validations:
      required: true
  - type: checkboxes
    id: multi-room
    attributes:
      label: Multi-Room Strat
      description: Does the logic require multi-room tech to perform (e.g. movement across a screen transition)?
      options:
        - label: The logic requires multi-room tech to perform
  - type: textarea
    id: how-to-perform
    attributes:
      label: How do you perform this logic?
      description: Provide steps to perform the logic in question including e.g. when dashes are required, what tech is required, etc.
    validations:
      required: true
  - type: input
    id: video-link
    attributes:
      label: Logic video (for link based videos, e.g. YouTube)
      description: Unless it is self-evident, ideally provide a video link of the logic being added to prove that it's doable. If a video is supplied here, there is no need to upload a video.
    validations:
      required: false
  - type: upload
    id: video
    attributes:
      label: Logic video (for uploading videos)
      description: Unless it is self-evident, ideally upload a video of the logic being added to prove that it's doable. If a video is supplied here, there is no need to provide a video link.
    validations:
      required: false
  - type: checkboxes
    id: latest-version
    attributes:
      label: Latest Version
      description: Are you using the latest version of the PopTracker pack?
      options:
        - label: I am using the latest version of the PopTracker pack.
          required: true