name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
assignees:
  - zeeveez
body:
  - type: markdown
    attributes:
      value: "## NOTE: This form is for non-logic related bug reports such as issues with tracker functionality. For logic related reports use the appropriate form."
  - type: textarea
    id: what-bug
    attributes:
      label: What is the bug?
      description: What is the bug you're reporting? Provide all details necessary.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: How can the bug be reproduced?
      description: What steps are required to reproduce the issue?
    validations:
      required: true
  - type: input
    id: demo-link
    attributes:
      label: Bug Demonstration (Link)
      description: Provide a link to a screenshot or video of the bug.
    validations:
      required: false
  - type: upload
    id: demo-upload
    attributes:
      label: Bug Demonstration (Upload)
      description: Upload a screenshot or video of the bug.
    validations:
      required: false